[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "project-name"
version = "0.1.0"
description = "Replace with your project description."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [
  { name = "your-org", email = "engineering@your-org.com" },
]
keywords = []
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]

# ── Runtime dependencies ─────────────────────────────────────
dependencies = [
  # Add your runtime dependencies here.
  # Example:
  # "httpx>=0.27",
  # "pydantic>=2.8",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "pytest-asyncio>=1.4.0",
  "black>=24.10",
  "isort>=5.13",
  "ruff>=0.8",
  "mypy>=1.13",
  "pre-commit>=4.0",
  "pip-audit>=2.7",
]

[project.scripts]
project-name = "src.index:main"

[project.urls]
Homepage = "https://github.com/your-org/project-name"
Documentation = "https://your-org.github.io/project-name"
Repository = "https://github.com/your-org/project-name"
Issues = "https://github.com/your-org/project-name/issues"
Changelog = "https://github.com/your-org/project-name/blob/main/CHANGELOG.md"

# ── Tool configs ─────────────────────────────────────────────

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.black]
line-length = 88
target-version = ["py311", "py312"]
include = '\.pyi?$'
extend-exclude = '''
/(
  | dist
  | build
  | .venv
)/
'''

[tool.isort]
profile = "black"
line_length = 88

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "B",   # flake8-bugbear
  "C4",  # flake8-comprehensions
  "UP",  # pyupgrade
  "N",   # pep8-naming
  "S",   # flake8-bandit (security)
  "T20", # flake8-print (no bare prints in production code)
]
ignore = [
  "S101", # Allow assert statements in tests
  "B008", # Do not perform function calls in default arguments (common in FastAPI)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "T20"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
show_error_codes = true
pretty = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
  "--strict-markers",
  "--strict-config",
  "-ra",
]
markers = [
  "slow: marks tests as slow (deselect with '-m \"not slow\"')",
  "integration: marks integration tests requiring external services",
  "unit: marks unit tests",
]

[tool.coverage.run]
source = ["src"]
omit = ["tests/*", "src/index.py"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 80
exclude_lines = [
  "pragma: no cover",
  "def __repr__",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "@(abc\\.)?abstractmethod",
]
