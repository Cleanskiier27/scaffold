[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lunarecycle-os"
version = "1.0.0"
description = "NASA & University of Alabama LunaRecycle Challenge Digital Twin Simulator and NASA Aerospace Resume Application Scanner"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [
  { name = "LunaRecycle OS Team", email = "research@lunarecycle.space" },
]
keywords = [
  "nasa",
  "lunarecycle",
  "university-of-alabama",
  "digital-twin",
  "lunar-isru",
  "waste-recycling",
  "resume-scanner",
  "ats-optimizer",
  "aerospace"
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Astronomy",
  "Topic :: Scientific/Engineering :: Physics",
]

dependencies = [
  "Flask>=3.0.0",
  "Jinja2>=3.1.0",
  "Werkzeug>=3.0.0",
]

[project.scripts]
lunarecycle = "src.index:main"

[project.urls]
Homepage = "https://github.com/lunarecycle-os/core"
Documentation = "https://github.com/lunarecycle-os/core/tree/main/docs"
Repository = "https://github.com/lunarecycle-os/core"

[tool.hatch.build.targets.wheel]
packages = ["src"]
