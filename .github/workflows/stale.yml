name: Stale Issues & PRs

on:
  schedule:
    # Runs at 06:00 UTC every day
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    name: Mark Stale
    runs-on: ubuntu-latest
    steps:
      - name: Mark stale issues and PRs
        uses: actions/stale@v9
        with:
          # ── Issues ─────────────────────────────
          days-before-issue-stale: 60
          days-before-issue-close: 14
          stale-issue-label: "stale"
          stale-issue-message: >
            This issue has been automatically marked as stale because it has
            had no activity for 60 days. It will be closed in 14 days unless
            it receives a comment or a label change.
            
            If this issue is still relevant, please comment to keep it open.
          close-issue-message: >
            This issue was closed automatically after 14 days of inactivity
            following the stale notice. If you believe it should remain open,
            please re-open it with a comment.

          # ── Pull Requests ────────────────────────
          days-before-pr-stale: 30
          days-before-pr-close: 7
          stale-pr-label: "stale"
          stale-pr-message: >
            This pull request has been automatically marked as stale because
            it has had no activity for 30 days. It will be closed in 7 days
            unless it receives a comment, commit, or review.
            
            If work is ongoing, please push a commit to reset the timer.
          close-pr-message: >
            This pull request was closed automatically after 7 days of
            inactivity following the stale notice. Feel free to re-open it
            if you'd like to continue the work.

          # ── Exempt labels ───────────────────────
          exempt-issue-labels: "pinned,security,in-progress,blocked"
          exempt-pr-labels: "pinned,security,in-progress,blocked,do-not-merge"
          
          # ── Misc ────────────────────────────────
          remove-stale-when-updated: true
          delete-branch: false
          operations-per-run: 100
