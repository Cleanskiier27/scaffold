name: "✨ Feature Request"
description: "Propose a new capability or improvement."
title: "feat: <short description>"
labels: ["enhancement", "needs-triage"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        > *"The best features are born from real pain, not imagined elegance."*
        
        Describe the problem first, then the solution. A feature without a problem is a guess.

  - type: textarea
    id: problem
    attributes:
      label: "What problem does this solve?"
      description: "Describe the friction you're experiencing. Be specific and concrete."
      placeholder: "When I try to do X, I have to Y and Z, which is painful because..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: "Proposed solution"
      description: "What would you like to see? How would it work?"
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: "Alternatives you've considered"
      description: "What workarounds or other approaches have you tried?"

  - type: dropdown
    id: priority
    attributes:
      label: "How important is this to you?"
      options:
        - "Nice to have"
        - "Would significantly improve my workflow"
        - "Blocking — I cannot use this project without it"
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: "Additional context"
      description: "Screenshots, mockups, links to prior discussions, related issues — anything that helps."

  - type: checkboxes
    id: checklist
    attributes:
      label: "Before submitting"
      options:
        - label: "I searched existing issues and feature requests to confirm this hasn't been proposed before."
          required: true
        - label: "I understand this may not be implemented or may be implemented differently than I described."
          required: true
