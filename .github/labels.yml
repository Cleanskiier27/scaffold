# GitHub Labels — synced via .github/workflows/label-sync.yml
# Color hex codes without the # prefix.

# ─────────────────────────────────────────────
# Type
# ─────────────────────────────────────────────
- name: "bug"
  color: "d73a4a"
  description: "Something isn't working"

- name: "enhancement"
  color: "a2eeef"
  description: "New feature or request"

- name: "documentation"
  color: "0075ca"
  description: "Improvements or additions to documentation"

- name: "security"
  color: "e4e669"
  description: "Security-related issue or fix"

- name: "performance"
  color: "f9d0c4"
  description: "Performance improvement"

- name: "refactor"
  color: "cfd3d7"
  description: "Code restructure with no functional change"

- name: "test"
  color: "bfd4f2"
  description: "Adding or updating tests"

# ─────────────────────────────────────────────
# Status
# ─────────────────────────────────────────────
- name: "needs-triage"
  color: "e4e669"
  description: "Awaiting maintainer review and classification"

- name: "in-progress"
  color: "0052cc"
  description: "Actively being worked on"

- name: "blocked"
  color: "b60205"
  description: "Blocked by external dependency or decision"

- name: "stale"
  color: "ededed"
  description: "No activity for an extended period"

- name: "wontfix"
  color: "ffffff"
  description: "This will not be worked on"

- name: "duplicate"
  color: "cfd3d7"
  description: "This issue or PR already exists"

- name: "invalid"
  color: "e4e669"
  description: "Doesn't seem right"

# ─────────────────────────────────────────────
# Priority
# ─────────────────────────────────────────────
- name: "priority: critical"
  color: "b60205"
  description: "Must be resolved immediately"

- name: "priority: high"
  color: "d93f0b"
  description: "Should be resolved in the current cycle"

- name: "priority: medium"
  color: "e4e669"
  description: "Should be resolved in an upcoming cycle"

- name: "priority: low"
  color: "0e8a16"
  description: "Nice to have"

# ─────────────────────────────────────────────
# Contribution
# ─────────────────────────────────────────────
- name: "good first issue"
  color: "7057ff"
  description: "Good for newcomers"

- name: "help wanted"
  color: "008672"
  description: "Extra attention is needed"

- name: "pinned"
  color: "0075ca"
  description: "Pinned — do not auto-close"

# ─────────────────────────────────────────────
# PR-specific
# ─────────────────────────────────────────────
- name: "do-not-merge"
  color: "b60205"
  description: "This PR should not be merged yet"

- name: "breaking-change"
  color: "d93f0b"
  description: "Introduces a breaking change"

- name: "dependencies"
  color: "0075ca"
  description: "Dependency update"
