# Pre-commit configuration — https://pre-commit.com
#
# Install hooks:   pre-commit install
# Run manually:    pre-commit run --all-files
# Update hooks:    pre-commit autoupdate
#
# Hooks run in the order listed. Fast checks come first to fail early.

default_language_version:
  python: python3.12

default_stages: [pre-commit]

# ─────────────────────────────────────────────
# Universal file hygiene
# ─────────────────────────────────────────────
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-symlinks
      - id: check-executables-have-shebangs
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: detect-private-key
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: no-commit-to-branch
        args: [--branch=main, --branch=production]

  # ─────────────────────────────────────────────
  # Secret scanning (Gitleaks)
  # ─────────────────────────────────────────────
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  # ─────────────────────────────────────────────
  # Python — formatting
  # ─────────────────────────────────────────────
  - repo: https://github.com/psf/black
    rev: 24.10.0
    hooks:
      - id: black
        language_version: python3.12

  # ─────────────────────────────────────────────
  # Python — import sorting
  # ─────────────────────────────────────────────
  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        args: [--profile=black]

  # ─────────────────────────────────────────────
  # Python — linting
  # ─────────────────────────────────────────────
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.6
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]

  # ─────────────────────────────────────────────
  # Python — type checking (optional, uncomment when ready)
  # ─────────────────────────────────────────────
  # - repo: https://github.com/pre-commit/mirrors-mypy
  #   rev: v1.13.0
  #   hooks:
  #     - id: mypy
  #       additional_dependencies: [types-all]

  # ─────────────────────────────────────────────
  # YAML linting
  # ─────────────────────────────────────────────
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.35.1
    hooks:
      - id: yamllint
        args: [--config-file=.yamllint.yml]

  # ─────────────────────────────────────────────
  # Markdown linting
  # ─────────────────────────────────────────────
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.43.0
    hooks:
      - id: markdownlint
        args: [--config=.markdownlint.yml]

  # ─────────────────────────────────────────────
  # Commit message lint (Conventional Commits)
  # ─────────────────────────────────────────────
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v3.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [feat, fix, docs, style, refactor, test, chore, ci, perf, revert]

  # ─────────────────────────────────────────────
  # Shell scripts
  # ─────────────────────────────────────────────
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck

  # ─────────────────────────────────────────────
  # Dockerfile linting (uncomment if you have Dockerfiles)
  # ─────────────────────────────────────────────
  # - repo: https://github.com/hadolint/hadolint
  #   rev: v2.12.0
  #   hooks:
  #     - id: hadolint-docker
