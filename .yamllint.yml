---
# yamllint configuration — https://yamllint.readthedocs.io
extends: default

rules:
  line-length:
    max: 120
    level: warning
  document-start:
    present: false
  truthy:
    allowed-values: ["true", "false", "on", "off"]
    check-keys: true
  comments:
    min-spaces-from-content: 1
  brackets:
    min-spaces-inside: 0
    max-spaces-inside: 0
  braces:
    min-spaces-inside: 0
    max-spaces-inside: 1

ignore: |
  .venv/
  node_modules/
  dist/
  build/
